[tool.poetry]
name = "haemorl"
version = "5.1.0"
description = "HaemoRL — Real-time Organ Allocation Reinforcement Learning Environment"
authors = ["HaemoRL Team <haemorl@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["reinforcement-learning", "organ-allocation", "medical-ai", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
pydantic = "^2.7.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
websockets = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"
black = "^24.0"
ruff = "^0.4"

[tool.poetry.scripts]
haemorl = "app:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
